<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Landing Page</title>

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Search Icon -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search">
</head>

<body>

    <!-- Header -->
    <div class="right">
        <ul>
            <li><a href="#">Gmail</a></li>
            <li><a href="#">Images</a></li>
            <li><button class="sign-in">Sign In</button></li>
            <li><button class="menu">☰</button></li>
        </ul>
    </div>

    <!-- Logo -->
    <div class="logo">
        <img src="googlelogo.png" alt="Google Logo">
    </div>

    <!-- Search Bar -->
    <form>
        <input type="text" placeholder="Search anything...">
        <button type="submit" class="search-btn">
            <span class="material-symbols-outlined">search</span>
        </button>
    </form>

    <!-- Buttons -->
    <div class="search">
        <ul>
            <li><button class="google-btn">Google Search</button></li>
            <li><button class="google-btn">I'm Feeling Lucky</button></li>
        </ul>
    </div>

</body>
</html>
